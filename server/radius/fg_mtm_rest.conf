# FreeRADIUS 3.x template. Set FG_REST_ORIGIN to an HTTPS origin in production.
rest fg_mtm_rest {
    connect_uri = "$ENV{FG_REST_ORIGIN}"
    authenticate {
        uri = "${..connect_uri}/v1/radius/authenticate"
        method = "get"
        body = "none"
        auth = "basic"
        username = "%{User-Name}"
        password = "%{User-Password}"
    }
    accounting {
        uri = "${..connect_uri}/v1/radius/accounting"
        method = "post"
        body = "json"
    }
    tls {
        check_cert = yes
        check_cert_cn = yes
    }
    pool {
        start = 0
        min = 0
        max = 4
        spare = 1
        uses = 0
        lifetime = 0
        idle_timeout = 60
    }
}
