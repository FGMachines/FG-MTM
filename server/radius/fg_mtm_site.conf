# Isolated loopback test site. Production needs explicitly provisioned NAS clients,
# strong distinct RADIUS shared secrets, firewall rules and HTTPS for REST.
server fg_mtm_test {
    listen {
        type = auth
        ipaddr = 127.0.0.1
        port = 11812
    }
    listen {
        type = acct
        ipaddr = 127.0.0.1
        port = 11813
    }
    authorize {
        if (&User-Password) {
            update control {
                Auth-Type := REST
                REST-HTTP-Header := "X-FG-NAS-Key: $ENV{FG_NAS_KEY}"
            }
        }
        else {
            reject
        }
    }
    authenticate {
        Auth-Type REST {
            fg_mtm_rest
        }
    }
    preacct {
        acct_unique
    }
    accounting {
        update control {
            REST-HTTP-Header := "X-FG-NAS-Key: $ENV{FG_NAS_KEY}"
        }
        fg_mtm_rest
    }
}
