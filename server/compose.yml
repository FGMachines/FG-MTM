services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fgmtm
      POSTGRES_USER: fgmtm
      POSTGRES_PASSWORD: ${FG_DB_PASSWORD:?Set a unique database password}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fgmtm"]
      interval: 5s
      retries: 20
  migrate:
    build: .
    command: ["python", "-m", "fg_server", "migrate"]
    environment: &database
      FG_DATABASE_URL: postgresql://fgmtm:${FG_DB_PASSWORD}@db/fgmtm
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment: *database
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "fg_server", "worker"]
    environment: *database
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
volumes:
  pgdata:
