name: Publish verified Android APK
on:
  push:
    branches: [main]
    paths: ["distribution/android-0.20.6/**", ".github/workflows/publish-android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-0.20.6-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct approved APK and verify SHA256
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,pathlib,zipfile,base64
          m=json.loads(pathlib.Path('distribution/android-0.20.6/manifest.json').read_text())
          assert m['sha256']=='36a3dd19f3184415086fde0e62e5ddd877cd5aee829749594555b88f46a77122'
          assert m['size']==4009984
          data=b''.join(base64.b64decode(pathlib.Path(p).read_text()) for p in m['parts'])
          assert len(data)==m['size'], 'Size mismatch'
          assert hashlib.sha256(data).hexdigest()==m['sha256'], 'SHA256 mismatch'
          out=pathlib.Path('android-assets');out.mkdir()
          apk=out/m['asset'];apk.write_bytes(data)
          with zipfile.ZipFile(apk) as z:
              assert 'AndroidManifest.xml' in z.namelist()
              assert z.testzip() is None, 'Invalid ZIP entry'
          (out/'SHA256SUMS.txt').write_text(m['sha256']+'  '+m['asset']+'\n')
          report=json.loads(pathlib.Path('distribution/android-0.20.6/verification.json').read_text())
          assert report['upgrade_to']=='0.20.6-review'
          assert report['install_replace']=='passed' and report['saved_router_profile_preserved']
          assert report['candidate_sha256']==m['sha256']
          assert report['settings_two_columns'] and report['paired_connection_credentials']
          assert report['business_grid_navigation']=='passed' and report['small_screen_large_font']=='passed'
          assert report['read_only_router_fixture_navigation']=='passed' and not report['crashes']
          PYCODE
      - name: Verify Android 15 signature and stable certificate
        run: |
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [ ! -x "$signer" ]; then
            sdkmanager "build-tools;35.0.0"
          fi
          "$signer" verify --min-sdk-version 35 --max-sdk-version 35 --print-certs android-assets/FG-MTM-Android-0.20.6.apk > certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-assets/FG-MTM-Android-0.20.6.apk > identity.txt
          grep -F "name='com.fgmachines.mikrotikmanager.preview'" identity.txt
          grep -F "versionCode='36'" identity.txt
          if grep -q application-debuggable identity.txt; then exit 1; fi
          grep -Fx 'Signer #1 certificate SHA-256 digest: 4218f40caf43573a4ef9f79279e43f5a54424cdf28436e45ee3a1e84645fc502' certificate.txt
      - name: Write release notes
        run: |
          cat > notes.md <<'NOTES'
          نسخة Android 0.20.6 المعتمدة من FG MTM.

          إدارة MikroTik من الهاتف، إنشاء كروت HotSpot وUser Manager وPPPoE، ومتابعة المشتركين والأعمال. واجهة عربية، مركز راوترات، وأدوات تشخيص ومراقبة حسب إعداد الجهاز وصلاحيات الحساب.

          إعادة تنسيق الواجهة بالاعتماد على نسخة 0.20.4 المرفقة: بطاقات رئيسية تتكيف مع ارتفاع الشاشة، إعدادات بعمودين، شبكة أعمال بعمودين على الهاتف وثلاثة على العرض الكبير، وتنسيق حقلي اسم المستخدم وكلمة المرور جنبًا إلى جنب. يستمر دعم العربية RTL والإنجليزية LTR، وتكبر البطاقات عند تكبير الخط.

          حماية R8 وتقليص الموارد وتعطيل Debug مستمرة. التوقيع الأصلي وهوية التثبيت محفوظان. اجتاز الإصدار اختبار تحديث 0.20.5 على Android 15 مع بقاء بروفايل الراوتر المحفوظ، والتنقل بالعربية والإنجليزية. اختبار واجهات الراوتر استخدم محاكاة API محلية للقراءة، ولم يتضمن جهاز MikroTik فعليًا.

          ثبّت التحديث فوق النسخة الحالية دون حذف التطبيق. تفاصيل التحقق: docs/ANDROID-0.20.6-AR.md.

          بصمة SHA256 موجودة في SHA256SUMS.txt. كتاب الاستخدام: https://github.com/FGMachines/FG-MTM/blob/main/docs/FG-MTM-User-Book-AR.pdf
          NOTES
      - name: Publish Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v0.20.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-v0.20.6 android-assets/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit android-v0.20.6 --title "FG MTM Android 0.20.6" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create android-v0.20.6 android-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FG MTM Android 0.20.6" --notes-file notes.md --latest=false
          fi
