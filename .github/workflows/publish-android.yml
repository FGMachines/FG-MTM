name: Publish verified Android APK
on:
  push:
    branches: [main]
    paths: ["distribution/android-0.20.11/**", ".github/workflows/publish-android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-0.20.11-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified APK
        run: |
          python3 - <<'PY'
          import pathlib,json,base64,hashlib,zipfile
          root=pathlib.Path('distribution/android-0.20.11');m=json.loads((root/'manifest.json').read_text())
          assert m['sha256']=='3d5a79b94d3503b8ea030e6072d07f49c648fd354733682742f8af4f593d06c3' and m['size']==4026561
          assert m['asset']=='FG-MTM-Android-0.20.11.apk' and m['source_commit']=='e8d4c900b2ad35bf1dc407cd6caa969a9b57bcfe'
          data=b''.join(base64.b64decode((root/p).read_text(),validate=True) for p in m['parts'])
          assert len(data)==m['size'] and hashlib.sha256(data).hexdigest()==m['sha256']
          r=json.loads((root/'verification.json').read_text())
          assert r['candidate_sha256']==m['sha256'] and r['source_commit']==m['source_commit']
          assert r['upgrade_from']=='0.20.10' and r['upgrade_to']=='0.20.11'
          assert r['app_label']=='FG MTM' and r['version_code']==41
          assert r['install_replace']=='passed' and r['saved_router_profile_preserved'] and not r['crashes']
          assert r['volunteer_support_arabic_english'] and r['volunteer_card_first'] and r['whatsapp_link_correct_number'] and r['facebook_link_correct'] and r['volunteer_name_phone_same_row'] and r['all_about_cards_visible_without_scroll']
          assert not r['call_placed'] and not r['whatsapp_message_sent']
          assert r['unit_tests']==169 and r['unit_failures']==0 and r['lint_errors']==0
          assert r['android_ui_tests']==3 and r['android_ui_failures']==0
          out=pathlib.Path('android-assets');out.mkdir()
          apk=out/m['asset'];apk.write_bytes(data)
          with zipfile.ZipFile(apk) as z: assert z.testzip() is None and 'AndroidManifest.xml' in z.namelist()
          (out/'SHA256SUMS.txt').write_text(m['sha256']+'  '+m['asset']+'\n')
          PY
      - name: Verify original certificate, name and identity
        run: |
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [ ! -x "$signer" ]; then sdkmanager 'build-tools;35.0.0'; fi
          "$signer" verify --min-sdk-version 26 --max-sdk-version 35 --print-certs android-assets/FG-MTM-Android-0.20.11.apk > certificate.txt
          grep -Fx 'Signer #1 certificate SHA-256 digest: 4218f40caf43573a4ef9f79279e43f5a54424cdf28436e45ee3a1e84645fc502' certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-assets/FG-MTM-Android-0.20.11.apk > identity.txt
          grep -F "name='com.fgmachines.mikrotikmanager.preview'" identity.txt
          grep -F "versionCode='41'" identity.txt
          grep -F "versionName='0.20.11'" identity.txt
          grep -Fx "application-label:'FG MTM'" identity.txt
          if grep -q application-debuggable identity.txt; then exit 1; fi
      - name: Write release notes
        run: |
          cat > notes.md <<'NOTES'
          FG MTM Android 0.20.11
          
          - FG MTM Android 0.20.11 — تعديل تنسيق صفحة عن المطور.
          - ضغط بطاقة الدعم ووضع اسم أبو يوسف عطا مقابل رقمه في سطر واحد، وتقليل المسافات لإظهار بقية بطاقات الصفحة.
          - أبو يوسف عطا متطوع للمساعدة في فهم التطبيق واستخدامه، والرقم 01223005507 للتواصل عبر WhatsApp فقط. زر واتساب يفتح المحادثة على https://wa.me/201223005507 وزر فيسبوك يفتح صفحة أبو يوسف عطا https://www.facebook.com/share/1FbU5L2dvf/.
          - الحفاظ على تصميم التطبيق وحماية R8 وتقليص الموارد والتوقيع الأصلي وهوية التثبيت com.fgmachines.mikrotikmanager.preview.
          
          ثبّت فوق النسخة الحالية دون حذف التطبيق.
          
          التحقق: 169 اختبار وحدة و3 اختبارات Android لصفحة الدعم ناجحة، وLint دون أخطاء مع 19 تحذيرًا.
          اجتاز APK الموقّع تحديث 0.20.10 إلى 0.20.11 على Android 15 مع بقاء الجهاز المحفوظ.
          الحجم: 4026561 بايت.
          SHA256: 3d5a79b94d3503b8ea030e6072d07f49c648fd354733682742f8af4f593d06c3
          ظهرت البطاقات الثماني كاملة على مقاس 393×873dp، والتحقق تم على محاكي Android 15. لم يُختبر هاتف فعلي ولم تُرسل رسائل.
          تغيير الاسم لا يزيل تحذير Play Protect ولا يعني اعتماد Google للتطبيق.
          NOTES
      - name: Publish official APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v0.20.11 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-v0.20.11 android-assets/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit android-v0.20.11 --title "FG MTM Android 0.20.11" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create android-v0.20.11 android-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FG MTM Android 0.20.11" --notes-file notes.md --latest=false
          fi
