name: Publish verified Android APK
on:
  push:
    branches: [main]
    paths: ["distribution/android-0.20.7/**", ".github/workflows/publish-android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-0.20.7-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct approved APK and verify SHA256
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,pathlib,zipfile,base64
          m=json.loads(pathlib.Path('distribution/android-0.20.7/manifest.json').read_text())
          assert m['sha256']=='10a3bf40ddbce499fcd94ce58cd3d393475fe6619ae72a9da8cf46023a0e775b'
          assert m['size']==4010047
          data=b''.join(base64.b64decode(pathlib.Path(p).read_text()) for p in m['parts'])
          assert len(data)==m['size'], 'Size mismatch'
          assert hashlib.sha256(data).hexdigest()==m['sha256'], 'SHA256 mismatch'
          out=pathlib.Path('android-assets');out.mkdir()
          apk=out/m['asset'];apk.write_bytes(data)
          with zipfile.ZipFile(apk) as z:
              assert 'AndroidManifest.xml' in z.namelist()
              assert z.testzip() is None, 'Invalid ZIP entry'
          (out/'SHA256SUMS.txt').write_text(m['sha256']+'  '+m['asset']+'\n')
          report=json.loads(pathlib.Path('distribution/android-0.20.7/verification.json').read_text())
          assert report['upgrade_to']=='0.20.7-review'
          assert report['install_replace']=='passed' and report['saved_router_profile_preserved']
          assert report['candidate_sha256']==m['sha256']
          assert report['settings_two_columns'] and report['paired_connection_credentials']
          assert report['business_grid_navigation']=='passed' and report['small_screen_large_font']=='passed'
          assert report['read_only_router_fixture_navigation']=='passed' and not report['crashes']
          assert report['reference_apk_sha256']=='fc591a206c8c0770019adb27de6b6532546784c0d66af11d71243010f0e7e3ea'
          assert all(report[k] for k in ['disconnect_settings_only','compact_voucher_tiles','voucher_mode_menu','expiry_and_print_dialogs','github_and_facebook_group_links','website_under_construction_note','subscriber_statistics','user_manager_statistics','router_profile_dropdown','program_feature_sections'])
          assert report['offline_voucher_generation']=='passed' and report['offline_bottom_navigation']
          assert report['source_commit']==m['source_commit']=='e2ba736c7b3b92076f930779a761a4cf1a971b97'
          assert report['source_build_run']==m['source_build_run']
          PYCODE
      - name: Verify Android 15 signature and stable certificate
        run: |
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [ ! -x "$signer" ]; then
            sdkmanager "build-tools;35.0.0"
          fi
          "$signer" verify --min-sdk-version 35 --max-sdk-version 35 --print-certs android-assets/FG-MTM-Android-0.20.7.apk > certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-assets/FG-MTM-Android-0.20.7.apk > identity.txt
          grep -F "name='com.fgmachines.mikrotikmanager.preview'" identity.txt
          grep -F "versionCode='37'" identity.txt
          if grep -q application-debuggable identity.txt; then exit 1; fi
          grep -Fx 'Signer #1 certificate SHA-256 digest: 4218f40caf43573a4ef9f79279e43f5a54424cdf28436e45ee3a1e84645fc502' certificate.txt
      - name: Write release notes
        run: |
          cat > notes.md <<'NOTES'
          نسخة Android 0.20.7 المعتمدة من FG MTM.

          إدارة MikroTik من الهاتف، إنشاء كروت HotSpot وUser Manager وPPPoE، ومتابعة المشتركين والأعمال. واجهة عربية، مركز راوترات، وأدوات تشخيص ومراقبة حسب إعداد الجهاز وصلاحيات الحساب.

          تصحيح التراجع عن تحسينات 0.20.4: قطع الاتصال داخل الإعدادات فقط، وبطاقات الكروت المصغرة في ثلاثة صفوف، وقائمة اختيار نوع الكارت والمدة والباقات. خيارات كلمة المرور والانتهاء والطباعة والـQR في نوافذ مستقلة بإطارات ملونة. عودة رابط GitHub وجروب Facebook وملاحظة الموقع قيد الإنشاء في صفحة المطور، وإحصاءات المشتركين وUser Manager وأقسام عن البرنامج بأيقوناتها.

          اختُبرت نسخة 0.20.4 الأصلية والنسخة المصححة بنفس إعدادات محاكي Android 15، مع تحديث متتابع 0.20.4 ← 0.20.6 ← 0.20.7 وبقاء الجهاز المحفوظ. تشمل الأدلة العربية RTL والإنجليزية، إنشاء كروت بدون راوتر، وقوائم الباقات والمدة ونوافذ الطباعة والانتهاء. واجهات الراوتر اختُبرت باستخدام API محلي للقراءة؛ لم يُستخدم MikroTik فعلي.

          حماية R8 وتقليص الموارد وتعطيل Debug مستمرة، مع التوقيع الأصلي وهوية التثبيت نفسها.

          ثبّت التحديث فوق النسخة الحالية دون حذف التطبيق. تفاصيل التحقق: docs/ANDROID-0.20.7-AR.md.

          بصمة SHA256 موجودة في SHA256SUMS.txt. كتاب الاستخدام: https://github.com/FGMachines/FG-MTM/blob/main/docs/FG-MTM-User-Book-AR.pdf
          NOTES
      - name: Publish Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v0.20.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-v0.20.7 android-assets/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit android-v0.20.7 --title "FG MTM Android 0.20.7" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create android-v0.20.7 android-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FG MTM Android 0.20.7" --notes-file notes.md --latest=false
          fi

